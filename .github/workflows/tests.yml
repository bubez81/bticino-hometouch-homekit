name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  homebridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The plugin's own FFmpeg (ffmpeg-for-homebridge), as in production; apt mirrors stalled.
      - name: Install plugin dependencies
        run: npm ci --prefix homebridge-bticino-hometouch
      - run: npm test --prefix homebridge-bticino-hometouch
        env:
          BTICINO_TEST_FFMPEG: ${{ github.workspace }}/homebridge-bticino-hometouch/node_modules/ffmpeg-for-homebridge/ffmpeg

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant test framework
        run: pip install pytest-homeassistant-custom-component PyTurboJPEG
      - name: Run integration tests
        run: python -m pytest tests_ha -q

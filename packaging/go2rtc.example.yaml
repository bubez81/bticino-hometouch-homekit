# go2rtc for live video in Home Assistant (see docs/home-assistant.md).
# Keep this file private (mode 600): it holds the RTSP password.
api:
  listen: "127.0.0.1:1984"     # web UI/API only on the listener host
rtsp:
  listen: ":8554"              # LAN; Home Assistant pulls the stream from here
  username: "bticino"
  password: "<random password>"
webrtc:
  listen: ""                   # Home Assistant's own go2rtc provides WebRTC
log:
  level: info
streams:
  videocitofono: "exec:/usr/bin/python3 /opt/bticino-go2rtc/bticino_live_source.py --ffmpeg /opt/homebrew/bin/ffmpeg --output {output} --log /opt/bticino-go2rtc/live-source.log"

# Optional, experimental: talking from the browser (WebRTC Camera card).
# go2rtc's RTSP server does not relay the microphone, so the browser must use
# this go2rtc directly: open the API to Home Assistant with a password and
# enable WebRTC, then add a backchannel source to the stream.
#
# api:
#   listen: ":1984"
#   username: "homeassistant"
#   password: "<random password>"
# webrtc:
#   listen: ":8555"
# streams:
#   videocitofono:
#     - "exec:/usr/bin/python3 /opt/bticino-go2rtc/bticino_live_source.py --ffmpeg /opt/homebrew/bin/ffmpeg --output {output} --log /opt/bticino-go2rtc/live-source.log"
#     - "exec:/usr/bin/python3 /opt/bticino-go2rtc/bticino_talk_relay.py#backchannel=1#audio=alaw/8000"
